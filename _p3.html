<!DOCTYPE html><html><head><style>html,body{margin:0}iframe{border:0;display:block}</style></head><body>
<iframe id="f" width="390" height="844"></iframe>
<script>
var PAGES=['prepare.html','skydive.html','glacier.html','index.html','talk.html','itinerary.html','culture.html'];
var out=[],i=0;
function next(){
 if(i>=PAGES.length){document.title='RESULT::'+out.join(' ;; ')+'::END';return}
 var f=document.getElementById('f');
 f.onload=function(){
  setTimeout(function(){
   try{
    var d=f.contentDocument,w=f.contentWindow;
    var line=PAGES[i]+' iw='+w.innerWidth+' doc.sw='+d.documentElement.scrollWidth;
    var tws=d.querySelectorAll('.tw');
    for(var k=0;k<tws.length;k++){var n=tws[k],r=n.getBoundingClientRect();
      line+=' | tw'+k+' cw='+n.clientWidth+' sw='+n.scrollWidth+' 可捲='+(n.scrollWidth-n.clientWidth)+' R='+Math.round(r.right);}
    // 嘗試橫向捲動
    w.scrollTo(300,0); line+=' | scrollX後='+w.scrollX;
    w.scrollTo(0,0);
    var gs=d.querySelectorAll('.filters .grp');
    for(var k=0;k<gs.length;k++){line+=' | grp'+k+'可捲='+(gs[k].scrollWidth-gs[k].clientWidth)}
    // 觸控目標
    ['.s-x','.viewseg button','.fchip','.totop','.tk-stop','#packreset','.tk-ext','.cand','.leaflet-control-zoom a','.grpwrap .gs-btn','.tabbar a','.packgrp label','.vb-slow','.voicebar select','#v-test'].forEach(function(s){
      var n=d.querySelector(s); if(!n)return; var r=n.getBoundingClientRect();
      if(r.width||r.height) line+=' | '+s+'='+Math.round(r.width)+'x'+Math.round(r.height);
    });
    out.push(line);
   }catch(e){out.push(PAGES[i]+' ERR '+e.message)}
   i++;next();
  },2200);
 };
 f.src=PAGES[i];
}
next();
</script></body></html>
