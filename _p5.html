<!DOCTYPE html><html><body><iframe id="f" width="390" height="844" src="sights.html" style="border:0"></iframe>
<script>
var f=document.getElementById('f');
f.addEventListener('load',function(){setTimeout(function(){
 var d=f.contentDocument,w=f.contentWindow,o=[];
 var x=d.querySelector('.s-x');
 o.push('s-x hidden屬性='+x.hasAttribute('hidden')+' display='+getComputedStyle(x).display+
        ' 可見='+(x.getBoundingClientRect().width>0)+' opacity='+getComputedStyle(x).opacity);
 var t=d.querySelector('.totop');
 var cs=getComputedStyle(t),r=t.getBoundingClientRect();
 o.push('totop scrollY='+w.scrollY+' class='+t.className+' display='+cs.display+' opacity='+cs.opacity+
        ' rect='+Math.round(r.left)+','+Math.round(r.top)+' '+Math.round(r.width)+'x'+Math.round(r.height));
 var hit=d.elementFromPoint(r.left+r.width/2, r.top+r.height/2);
 o.push('totop 位置命中元素='+(hit?hit.tagName+'.'+hit.className:'null'));
 // pl-deep hidden 是否真的隱藏
 var dp=d.querySelector('.pl-deep');
 if(dp)o.push('pl-deep hidden='+dp.hasAttribute('hidden')+' display='+getComputedStyle(dp).display);
 // sheet
 var sh=d.querySelector('[data-sheet]');
 o.push('sheet hidden='+sh.hasAttribute('hidden')+' display='+getComputedStyle(sh).display);
 // viewseg 對比
 var seg=d.querySelectorAll('.viewseg button');
 o.push('viewseg on: bg='+getComputedStyle(seg[0]).backgroundColor+' off: bg='+getComputedStyle(seg[1]).backgroundColor+
        ' off色='+getComputedStyle(seg[1]).color);
 // 卡片 hover 假象：.pl / .cul / .card 是否可點
 var pl=d.querySelector('.pl');
 o.push('pl cursor='+getComputedStyle(pl).cursor+' onclick='+(!!pl.onclick)+' tag='+pl.tagName);
 // tabbar 當前頁是否有 aria-current
 var on=d.querySelector('.tabbar a.on');
 o.push('tabbar.on aria-current='+(on?on.getAttribute('aria-current'):'無 .on'));
 // 焦點環：模擬 Tab 到 fchip
 var fc=d.querySelector('.fchip'); fc.focus();
 var fcs=getComputedStyle(fc);
 o.push('fchip focus outline='+fcs.outlineWidth+' '+fcs.outlineStyle+' '+fcs.outlineColor);
 var vs=seg[1]; vs.focus();
 o.push('viewseg focus outline='+getComputedStyle(vs).outlineWidth+' '+getComputedStyle(vs).outlineStyle);
 var sx=d.querySelector('.s-x'); sx.focus();
 o.push('s-x focus outline='+getComputedStyle(sx).outlineWidth+' '+getComputedStyle(sx).outlineStyle);
 document.title='RESULT::'+o.join(' @@ ')+'::END';
},2500)});
</script></body></html>
